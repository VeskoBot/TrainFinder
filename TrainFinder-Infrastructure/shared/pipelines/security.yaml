trigger:
- none

pool:
  vmImage: ubuntu-latest

stages:
  - stage: BuildStg
    displayName: 'Build'
    jobs:
    - job: Security_Check
      displayName: 'Security Check'
      steps:
        - checkout: self
          enabled: true
        
        - task: UseDotNet@2
          displayName: 'Use .NET Core sdk 8.x for MicrosoftSecurityDevOps Check'
          enabled: true
          inputs:
            version: '8.x'
        
        - task: MicrosoftSecurityDevOps@1
          displayName: 'Microsoft Security DevOps'
          enabled: true
          inputs:
            categories: 'IaC'